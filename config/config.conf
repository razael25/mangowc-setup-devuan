# ~/.config/mango/config.conf — Super as the mod key.
# Reload live with Super+Shift+r. Full option list: /etc/mango/config.conf
# Everything this file runs lives under ~/.config/mango (scripts/, rofi/,
# dunst/, quickshell/, wallpaper/) so the setup is self-contained.

# wallpaper-theme writes border colours here on every wallpaper pick
source-optional=~/.config/mango/theme.conf

# --- look ---
borderpx=2
border_radius=6
gappih=5
gappiv=5
gappoh=0
gappov=0
focuscolor=0x80a0ffff
bordercolor=0x080808ff
urgentcolor=0xef9f76ff
blur=0
shadows=0
animations=1
animation_type_open=slide
animation_type_close=slide
animation_duration_open=250
animation_duration_close=250
animation_duration_tag=250
animation_duration_move=250

# --- input ---
numlockon=1
repeat_rate=50
repeat_delay=300
tap_to_click=1
trackpad_natural_scrolling=1
disable_while_typing=1
sloppyfocus=1

# --- layout: master/stack on every tag ---
new_is_master=1
default_mfact=0.55
tagrule=id:1,layout_name:tile
tagrule=id:2,layout_name:tile
tagrule=id:3,layout_name:tile
tagrule=id:4,layout_name:tile
tagrule=id:5,layout_name:tile
tagrule=id:6,layout_name:tile
tagrule=id:7,layout_name:tile
tagrule=id:8,layout_name:tile
tagrule=id:9,layout_name:tile
tagrule=id:10,layout_name:tile
tagrule=id:11,layout_name:tile
tagrule=id:12,layout_name:tile

# --- autostart ---
exec-once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY DISPLAY XDG_CURRENT_DESKTOP MANGO_INSTANCE_SIGNATURE
exec-once=swaybg -m fill -i $HOME/.config/mango/wallpaper/bluemountain.jpg
exec-once=dunst -config ~/.config/mango/dunst/dunstrc
exec-once=lxpolkit
exec-once=wl-paste --watch cliphist store
# quickshell bar (-n: exit if already running, so a config reload is safe)
exec-once=qs -p ~/.config/mango/quickshell -d -n

# --- apps ---
# Terminal
bind=SUPER,Return,spawn,kitty
# App launcher
bind=SUPER,space,spawn,rofi -show drun -show-icons -theme ~/.config/mango/rofi/config.rasi
# Browser
bind=SUPER,b,spawn,firefox-esr
# Browser (private)
bind=SUPER+SHIFT,b,spawn,firefox-esr --private-window
# Helium browser
bind=SUPER,c,spawn,helium
# File manager
bind=SUPER,f,spawn,thunar
# Editor
bind=SUPER,e,spawn,geany
# Power menu
bind=SUPER,x,spawn,~/.config/mango/scripts/power
# Keybinding help
bind=SUPER,slash,spawn,~/.config/mango/scripts/help

# --- bar popups (quickshell IPC) ---
# Wallpaper picker (re-themes the desktop from the image)
bind=SUPER+SHIFT,p,spawn,qs -p ~/.config/mango/quickshell ipc call wallpapers toggle
# Command menu
bind=SUPER+SHIFT,m,spawn,qs -p ~/.config/mango/quickshell ipc call commands toggle
# Network app
bind=SUPER+SHIFT,n,spawn,~/.config/mango/scripts/network
# Layout / tweaks picker
bind=SUPER+SHIFT,l,spawn,qs -p ~/.config/mango/quickshell ipc call layouts toggle

# --- windows ---
# Close window
bind=SUPER,q,killclient,
# Quit mango
bind=SUPER+SHIFT,q,quit
# Reload config
bind=SUPER+SHIFT,r,reload_config
# Toggle floating
bind=SUPER+SHIFT,space,togglefloating,
# Fullscreen
bind=SUPER+SHIFT,f,togglefullscreen,
# Cycle layouts
bind=SUPER,t,switch_layout
# Monocle layout
bind=SUPER,w,setlayout,monocle
# Overview of all windows
bind=SUPER,Tab,toggleoverview,
# Next / previous window
bind=ALT,Tab,focusstack,next
bind=ALT+SHIFT,Tab,focusstack,prev

# focus / move (arrows and hjkl)
bind=SUPER,Left,focusdir,left
bind=SUPER,Down,focusdir,down
bind=SUPER,Up,focusdir,up
bind=SUPER,Right,focusdir,right
bind=SUPER,h,focusdir,left
bind=SUPER,j,focusdir,down
bind=SUPER,k,focusdir,up
bind=SUPER,l,focusdir,right
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Down,exchange_client,down
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Right,exchange_client,right
bind=SUPER+SHIFT,h,exchange_client,left
bind=SUPER+SHIFT,j,exchange_client,down
bind=SUPER+SHIFT,k,exchange_client,up
bind=SUPER+SHIFT,l,exchange_client,right

# resize master area / master count
bind=SUPER+CTRL,Left,setmfact,-0.05
bind=SUPER+CTRL,Right,setmfact,+0.05
bind=SUPER+CTRL,Up,incnmaster,+1
bind=SUPER+CTRL,Down,incnmaster,-1

# --- tags (workspaces): 12, like the other setups. 10-12 need the
# butterrepo mangowc build (patches/12-tags.patch); stock mango has 9. ---
bind=SUPER,1,view,1
bind=SUPER,2,view,2
bind=SUPER,3,view,3
bind=SUPER,4,view,4
bind=SUPER,5,view,5
bind=SUPER,6,view,6
bind=SUPER,7,view,7
bind=SUPER,8,view,8
bind=SUPER,9,view,9
bind=SUPER,0,view,10
bind=SUPER,minus,view,11
bind=SUPER,equal,view,12
bind=SUPER+SHIFT,1,tag,1
bind=SUPER+SHIFT,2,tag,2
bind=SUPER+SHIFT,3,tag,3
bind=SUPER+SHIFT,4,tag,4
bind=SUPER+SHIFT,5,tag,5
bind=SUPER+SHIFT,6,tag,6
bind=SUPER+SHIFT,7,tag,7
bind=SUPER+SHIFT,8,tag,8
bind=SUPER+SHIFT,9,tag,9
bind=SUPER+SHIFT,0,tag,10
bind=SUPER+SHIFT,minus,tag,11
bind=SUPER+SHIFT,equal,tag,12

# --- media / screenshots ---
bind=NONE,XF86AudioRaiseVolume,spawn,~/.config/mango/scripts/changevolume up
bind=NONE,XF86AudioLowerVolume,spawn,~/.config/mango/scripts/changevolume down
bind=NONE,XF86AudioMute,spawn,~/.config/mango/scripts/changevolume mute
bind=NONE,XF86MonBrightnessUp,spawn,brightnessctl set +5%
bind=NONE,XF86MonBrightnessDown,spawn,brightnessctl set 5%-
# Screenshot (full screen)
bind=SUPER,s,spawn,~/.config/mango/scripts/screenshot full
# Screenshot (select region)
bind=SUPER+SHIFT,s,spawn,~/.config/mango/scripts/screenshot region

# --- mouse ---
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

# --- floating rules ---
# quickshell's network app (its own qs instance) — a small tool window
windowrule=isfloating:1,width:0.35,height:0.6,appid:org.quickshell
windowrule=isfloating:1,appid:mpv
windowrule=isfloating:1,appid:eog
windowrule=isfloating:1,appid:galculator
windowrule=isfloating:1,appid:transmission-gtk
windowrule=isfloating:1,appid:nwg-look
windowrule=isfloating:1,appid:pavucontrol
windowrule=isfloating:1,appid:blueman-manager
windowrule=isfloating:1,appid:thunar,title:^(File Operation Progress|Confirm|Properties|Rename|Create|Error|Question|Warning).*
